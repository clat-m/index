function buildForm(){
const p=DATA[$("prod").value];
$("plainNote").textContent=(p.t==="std"?"無地価格：" + p.plain.toLocaleString("ja-JP")+ "円　":"")+(p.sz?"取り扱いサイズ：" + p.sz:"");
let h="";
if(p.t==="std"){
if(p.sur)h +='<label><input type="checkbox" id="sur">' + p.sur[0]+ '（+' + p.sur[1]+ '円/枚）</label>';
if(p.xs)h +='<label>オプション <span class="hint">合計枚数のうち何枚か</span></label><div class="row sm">' + p.xs.map((x,i)=>'<div><div class="hint">' + x[0]+ '（+' + x[1].toLocaleString("ja-JP")+ '円）</div><input id="x' + i + '" type="number" inputmode="numeric" min="0" value="0"></div>').join("")+ '</div>' +(p.xn?'<p class="note">' + p.xn + '</p>':'');
h +=printUI();
}else{
h +='<label>内訳 <span class="hint">' +(p.all?'3Lサイズなどを入れると、注文枚数が増えます':'合計枚数の内訳を入れてください')+ '</span></label><div class="row">' +
p.opts.map((o,i)=>i===0
?'<div><div class="hint">' + o +(p.all?'':'（残り全部）')+ '</div><input id="o0" disabled></div>'
:'<div><div class="hint">' + o + '</div><input id="o' + i + '" type="number" inputmode="numeric" min="0" value="0"></div>').join("")+ '</div>';
if(p.all)h +='<label><input type="checkbox" id="allname">ネーム＋番号もしくはネームor番号：すべて</label>';
if(p.all)h +='<p class="note">1枚でも背ネーム・背番号が入る場合は、全枚数がネーム＋番号もしくはネームor番号の単価になります。3Lサイズなどの枚数は、注文枚数に追加されます。</p>';
if(p.note)h +='<p class="note">' + p.note + '</p>';
}
$("dyn").innerHTML=h;
if(p.all)[1,2,3].forEach(i=>{const e=$("o" + i);e.dataset.v=0;e.addEventListener("input",()=>{const n=num("o" + i),d=n -(+e.dataset.v);e.dataset.v=n;if(d)$("qty").value=num("qty")+ d;});});
$("dyn").querySelectorAll("input,select").forEach(e=>e.addEventListener("input",calc));
calc();
}
const pv=n=>{const e=document.querySelector('input[name="' + n + '"]:checked');return e?e.value:"0";};
function cstate(){const v=["pf","pb","pr","pl"].map(pv);return{v:v,fullN:v.filter(x=>x==="F").length,cols:v.reduce((a,x)=>a +(x==="F"?0:+x),0)};}
function drawTbl(p,t){
const box=$("tblBox");
if(p.t!=="std"){box.hidden=true;return;}
box.hidden=false;
const cs=cstate(),full=cs.fullN>0,cols=cs.cols;
let h='<tr><th>枚数</th><th>1色</th><th>2色</th><th>3色</th><th>4色</th><th>フル<br>加算</th></tr>';
p.tiers.forEach(x=>{
h +='<tr class="' +(x===t?"on":"")+ '"><td>' + x[0]+ '〜' + x[1]+ '枚</td>';
for(let n=1;n<=4;n++)h +='<td' +(x===t&&n===cols?' class="pick"':'')+ '>' + yen(x[2][n - 1])+ '</td>';
h +='<td' +(x===t&&full?' class="pick"':'')+ '>+' + x[3].toLocaleString("ja-JP")+ '</td></tr>';
});
$("tbl").innerHTML=h;
$("tblNote").textContent=t?"プリント料金（" + t[0]+ "〜" + t[1]+ "枚）：1色目 +" +(t[2][0]- p.plain).toLocaleString("ja-JP")+ "円、2色目から1色ごと +" +(t[2][1]- t[2][0]).toLocaleString("ja-JP")+ "円（5色以上も同じ）。前・背中・袖の色を合計して数えます。":"";
}
const upPs=()=>PLACES.forEach((q,i)=>{const e=$("ps" + i);if(!e)return;const c=pv(q[0]),m=pv(q[1]);e.textContent=(c==="0"?"なし":c==="F"?"フルカラー":c + "色")+(m!=="0"?"＋" + NMLAB[m]:"");e.className="ps" +(c!=="0"||m!=="0"?" on":"");});
const stEnc=()=>{const p=DATA[$("prod").value];return enc({p:+$("prod").value,q:num("qty"),v:["pf","pb","pr","pl","nf","nb","nr","nl"].map(pv),x:(p.xs||[]).map((_,i)=>num("x" + i)),s:$("sur")&&$("sur").checked?1:0,o:[1,2,3].map(i=>num("o" + i)),a:$("allname")&&$("allname").checked?1:0,w:WHEN,d:DSC});};
function calc(){
const p=DATA[$("prod").value],qty=num("qty"),out=$("o1"),o2=$("o2");
LAST=null;eW=0;o2.innerHTML="";$("ddw").hidden=true;
const allN=!!(p.all&&$("allname")&&$("allname").checked);
const tot=qty;
if(p.t==="std")upPs();
$("qnote").innerHTML=(tot>=26?"":'<p class="hint">26枚以上のご注文で、1枚分が無料になります。</p>');
const t=p.tiers.find(x=>tot>=x[0]&&tot<=x[1]);
drawTbl(p,t);
if(!t){
out.innerHTML='<p class="msg">この枚数の場合はお問い合わせください。</p>';
return;
}
$("ddw").hidden=false;$("ew").hidden=p.t!=="std";
$("ew").innerHTML=p.t==="std"?'<label class="opts"><input type="checkbox" data-d="w80">超早割（納期の20日前まで）-80円/枚</label><label class="opts"><input type="checkbox" data-d="w50">早割（納期の14日前まで）-50円/枚</label><div class="hint" style="margin:0 0 6px 26px">超早割と早割は、どちらか一方です。</div>':"";
if(!$("dsc").firstChild)$("dsc").innerHTML=dscHtml(0);
syncD();
let rows=[],freeV=0,selHtml="",dmsg=[],mp=0;
if(p.t==="std"){
let disc=WHEN;const cs=cstate(),fullN=cs.fullN,cols=cs.cols;
const sur=$("sur")&&$("sur").checked?p.sur[1]:0;
const nms=[];
PLACES.forEach(q=>{
const sel=pv(q[1]);
if(sel==="0")return;
nms.push({lab:q[2].replace("（むね側）","")+ "の" + NMLAB[sel]+(q[3]==="sr"||q[3]==="sl"?"（ワンポイント）":""),fee:(q[3]==="front"||q[3]==="back"?NMF:NMS)[sel],n:qty});
});
$("psum").textContent=(fullN||cols)?"合計 " +(cols?cols + "色分":"")+(fullN&&cols?"＋":"")+(fullN?"フルカラー" + fullN + "か所":""):"";
if(!fullN&&!cols&&!nms.length){out.innerHTML='<p class="msg">プリントする場所と色数を選んでください。</p>';return;}
const xs=(p.xs||[]).map((x,i)=>({lab:x[0],fee:x[1],kind:x[2],n:num("x" + i)}));
const sizeSum=xs.filter(x=>x.kind==="s").reduce((a,x)=>a + x.n,0);
if(sizeSum>qty||xs.some(x=>x.n>qty)||nms.some(x=>x.n>qty)){out.innerHTML='<p class="msg">オプションの枚数が注文枚数を超えています。</p>';return;}
const base=p.plain + fullN*t[3]+(cols?t[2][0]- p.plain +(cols - 1)*(t[2][1]- t[2][0]):0);
const gross=base*qty + sur*qty + xs.reduce((a,x)=>a + x.n*x.fee,0)+ nms.reduce((a,x)=>a + x.n*x.fee,0);
if(disc&&gross<10000){dmsg.push("超早割・早割は、合計金額1万円以上が条件のため適用されません。");disc=0;}
if(DSC.m){const c=+DSC.mv||0;if(c<2)dmsg.push("みんな割：同時に注文するクラス数（2以上）を入力してください。");else if(gross<10000)dmsg.push("みんな割は、1クラス1万円以上が条件のため適用されません。");else mp=10*Math.min(5,c);}
eW=disc;
const say=PLACES.map((q,i)=>{const c=cs.v[i],m=pv(q[1]),a=[];if(c!=="0")a.push(c==="F"?"フルカラー":c + "色プリント");if(m!=="0")a.push(NMLAB[m]);return a.length?q[2].replace("（むね側）","")+ "：" + a.join("＋"):"";}).filter(Boolean).join("／");
selHtml='<div class="sel"><div style="display:flex">' + mini(cs.v[0],pv("nf"),0,cs.v[2],cs.v[3])+ mini(cs.v[1],pv("nb"),1,cs.v[2],cs.v[3])+ '</div><div><b>選んだ内容</b><br>' + say +(nms.length?'<br><span class="hint">※ネーム・ゼッケンは色数に含みません</span>':'')+ '</div></div>';
const parts=[];if(cols)parts.push("色数" + cols + "色分");if(fullN)parts.push("フルカラー" + fullN + "か所");
const placeTxt=PLACES.map((q,i)=>cs.v[i]==="0"?"":q[2].replace("（むね側）","")+(cs.v[i]==="F"?"フルカラー":cs.v[i]+ "色")).filter(Boolean).join("＋");
rows.push([(placeTxt?placeTxt + "（" + parts.join("＋")+ "）":"プリントなし")+ "（" + qty + "枚 × " + yen(base)+ "）",base*qty,0]);
if(sur)rows.push([p.sur[0]+ "（" + qty + "枚）",sur*qty,0]);
if(disc)rows.push([(disc===50?"早割":"超早割")+ "（" + qty + "枚 × -" + disc + "円）",-disc*qty,2]);
if(mp)rows.push(["みんな割（" + qty + "枚 × -" + mp + "円）",-mp*qty,2]);
xs.forEach(x=>{if(x.n)rows.push([x.lab + "（" + x.n + "枚）",x.n*x.fee,2]);});
nms.forEach(x=>{if(x.n)rows.push([x.lab + "（" + x.n + "枚 × " + yen(x.fee)+ "）",x.n*x.fee,1]);});
let forced=0;const singles=[];
const sg=xs.filter(x=>x.kind==="s"&&x.n);
if(sg.length&&sizeSum===qty)forced +=Math.min.apply(null,sg.map(x=>x.fee));else sg.forEach(x=>singles.push(x.fee));
xs.filter(x=>x.kind==="c"&&x.n).forEach(x=>{if(x.n===qty)forced +=x.fee;else singles.push(x.fee);});
nms.filter(x=>x.n).forEach(x=>{if(x.n===qty)forced +=x.fee;else singles.push(x.fee);});
freeV=base - disc - mp + sur + forced + Math.max.apply(null,[0].concat(singles));
}else{
let rest=qty,cnt=[];
for(let i=1;i<p.opts.length;i++){
if(p.all&&i>=2){$("o" + i).disabled=allN;if(allN){$("o" + i).value=0;$("o" + i).dataset.v=0;}}
cnt[i]=(allN&&i>=2)?0:num("o" + i);rest -=cnt[i];
}
if(rest<0){out.innerHTML='<p class="msg">内訳の枚数が注文枚数を超えています。</p>';return;}
cnt[0]=rest;$("o0").value=rest;
const prc=t[2].slice(),lab=p.opts.slice();
if(p.all&&(allN||cnt[2]+ cnt[3]>0)){prc[0]=t[2][2];prc[1]=t[2][3];lab[0]="通常サイズ（ネーム＋番号もしくはネームor番号）";lab[1]="3Lサイズ（ネーム＋番号もしくはネームor番号）";}
p.opts.forEach((o,i)=>{if(cnt[i])rows.push([lab[i]+ "（" + cnt[i]+ "枚 × " + yen(prc[i])+ "）",cnt[i]*prc[i]]);});
freeV=Math.max(0,...prc.filter((x,i)=>cnt[i]>0));
}
if(tot>=26&&freeV>0)rows.push(["26枚以上のご注文：1枚分無料（最も高い1枚）",-freeV,p.t==="std"?2:void 0]);
const sub0=rows.reduce((s,r)=>s + r[1],0);
[["t","タグ付け割"],["e","アンケート割"],["r","リピ割"]].forEach(a=>{if(!DSC[a[0]])return;if(sub0>=10000)rows.push([a[1]+ "（合計から）",-500,p.t==="std"?2:void 0]);else dmsg.push(a[1]+ "は、合計金額1万円以上が条件のため適用されません。");});
if(p.t!=="std"&&DSC.m)dmsg.push("みんな割は、ふるプリ・無地・タオルは対象外です。");
const total=rows.reduce((s,r)=>s + r[1],0);
LAST={pn:p.n,sz:p.szl,q:tot,r:rows,t:total,w:String(eW),pl:rows.filter(r=>r[1]>0).map(r=>r[0]).join(" / ")};
const msg="【クラTマガジン】見積の問い合わせ\n商品：" + p.n + "\n枚数：" + tot + "枚\n" +
rows.map(r=>"・" + r[0]+ "：" +(r[1]<0?"-":"")+ yen(Math.abs(r[1]))).join("\n")+
"\n概算合計（税込）：" + yen(total)+ "\n※自動見積の概算です。";
const tr=r=>'<tr><td>' + r[0]+ '</td><td>' +(r[1]<0?"-":"")+ yen(Math.abs(r[1]))+ '</td></tr>';
const orderBtn='<a class="btn blue" target="_blank" rel="noopener" href="' + ORDER_URL + '#e=' + stEnc()+ '">この内容で注文する</a>';
const lineBtn='<a class="btn" target="_blank" rel="noopener" href="https://line.me/R/oaMessage/' + encodeURIComponent(LINE_ID)+ '/?' + encodeURIComponent(msg)+ '">この内容で問い合わせる（LINE）</a>' +
'<p class="note">LINEが開き、見積内容が入力された状態になります。送信ボタンを押すと送られます。</p>';
out.innerHTML='<p class="total">' + yen(total)+ '</p><p class="per">税込 ／ 1枚あたり平均 ' + yen(total / tot)+ '</p>' + selHtml;
o2.innerHTML=(tot>=26?WARN:'')+
'<table>' +(p.t==="std"?[0,1,2].map(g=>{const a=rows.filter(r=>r[2]===g);return a.length?'<tr><th colspan="2" class="gh">' +["プリント代（色数で決まる料金）","ネーム・ゼッケン代（色数とは別料金）","サイズ加算・割引など"][g]+ '</th></tr>' + a.map(tr).join(""):"";}).join(""):rows.map(tr).join(""))+ '</table><p class="note">通常インクの場合の金額になります。特殊インクをご使用の場合は別途料金がかかります。</p>' +
dmsg.map(m=>'<p class="warn" style="font-size:.8rem">' + m + '</p>').join("")+(DSC.a?'<p class="note">メディアぷらす：商品到着後1週間以内に写真・動画を送ると1枚分無料です（スタッフが後ほど適用します）。</p>':'')+ orderBtn + lineBtn;
}
$("prod").addEventListener("input",buildForm);
$("qty").addEventListener("input",calc);
buildForm();
{const q=new URLSearchParams(location.search).get("item"),i=DATA.findIndex(d=>d.n===q);if(i>=0){$("prod").value=i;buildForm();}}
</script>
</body>
</html>
